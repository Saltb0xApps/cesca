<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pawmodoro — Dachshund Pomodoro</title>
  <meta name="description" content="A cozy pixel-art pomodoro timer where Noodle the dachshund stretches toward a bone while you focus.">
  <meta name="theme-color" content="#FBF4E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221A13" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pawmodoro">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="focus">
  <main class="app">
    <header class="top">
      <h1 class="brand">
        <span class="brand-bone" aria-hidden="true"></span>
        <span id="brandText" class="brand-text">Pawmodoro</span>
      </h1>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">
        <span class="pix-icon" data-icon="gear" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="phases" aria-label="Timer phase">
      <button class="phase-btn" data-phase-btn="focus">Focus</button>
      <button class="phase-btn" data-phase-btn="short">Short Break</button>
      <button class="phase-btn" data-phase-btn="long">Long Break</button>
    </nav>

    <div class="clock" id="clock" role="timer" aria-live="off">25:00</div>
    <p class="cycle-note" id="cycleNote">Bone 1 of 4</p>

    <div class="scene" id="scene">
      <div class="bubble" id="bubble" hidden>Woof!</div>
      <svg id="dogSvg" viewBox="0 0 92 34" shape-rendering="crispEdges" role="img" aria-label="Noodle the pixel dachshund">
        <defs>
          <pattern id="checker" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect width="1" height="1" class="gA"/>
            <rect x="1" y="1" width="1" height="1" class="gA"/>
            <rect x="1" width="1" height="1" class="gB"/>
            <rect y="1" width="1" height="1" class="gB"/>
          </pattern>
        </defs>
        <rect class="groundStrip" x="1" y="31" width="90" height="2" fill="url(#checker)"/>
        <g id="boneTarget" class="bone-target"></g>
        <g id="dog"></g>
      </svg>
    </div>

    <div class="bones" id="boneRow" role="img" aria-label="Bones earned this cycle"></div>

    <div class="controls">
      <button id="resetBtn" class="icon-btn big" aria-label="Reset timer">
        <span class="pix-icon" data-icon="reset" aria-hidden="true"></span>
      </button>
      <button id="startBtn" class="primary">Start</button>
      <button id="skipBtn" class="icon-btn big" aria-label="Skip to next phase">
        <span class="pix-icon" data-icon="skip" aria-hidden="true"></span>
      </button>
    </div>

    <p class="hint" id="todayNote">0 bones today</p>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </main>

  <dialog id="settingsDlg">
    <form method="dialog" id="settingsForm">
      <h2 id="settingsTitle">Settings</h2>
      <div class="field"><label for="setFocus">Focus minutes</label><input id="setFocus" type="number" min="1" max="180" inputmode="numeric"></div>
      <div class="field"><label for="setShort">Short break</label><input id="setShort" type="number" min="1" max="60" inputmode="numeric"></div>
      <div class="field"><label for="setLong">Long break</label><input id="setLong" type="number" min="1" max="90" inputmode="numeric"></div>
      <div class="field"><label for="setEvery">Long break every</label><input id="setEvery" type="number" min="2" max="8" inputmode="numeric"></div>
      <div class="field check"><label for="setAutoBreak">Auto-start breaks</label><input id="setAutoBreak" type="checkbox"></div>
      <div class="field check"><label for="setAutoFocus">Auto-start focus</label><input id="setAutoFocus" type="checkbox"></div>
      <div class="field check"><label for="setSound">Sounds</label><input id="setSound" type="checkbox"></div>
      <div class="field check"><label for="setAwake">Keep screen awake</label><input id="setAwake" type="checkbox"></div>
      <button type="button" id="notifyBtn" class="ghost-wide">Enable notifications</button>
      <button value="save" class="primary save">Done</button>
    </form>
  </dialog>

  <script src="pixel.js"></script>
  <script src="app.js"></script>
</body>
</html>
