<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🍅 Pomodoro</h1>

    <input
      id="task"
      class="task-input"
      type="text"
      placeholder="What are you working on?"
      autocomplete="off"
    />

    <div id="timer" class="timer">25:00</div>
    <div id="mode" class="mode">Focus</div>

    <div class="controls">
      <button id="startPause" class="btn btn-primary">Start</button>
      <button id="reset" class="btn">Reset</button>
      <button id="skip" class="btn">Skip</button>
    </div>

    <div class="lengths">
      <label>Focus <input id="focusLen" type="number" min="1" max="120" value="25" /> min</label>
      <label>Break <input id="breakLen" type="number" min="1" max="60" value="5" /> min</label>
    </div>

    <section class="stats">
      <div>
        <span id="todayCount" class="big">0</span>
        <span class="label">pomodoros today</span>
      </div>
      <div>
        <span id="totalCount" class="big">0</span>
        <span class="label">all time</span>
      </div>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>History</h2>
        <button id="clearHistory" class="btn btn-small">Clear</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
