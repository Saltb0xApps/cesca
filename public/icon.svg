<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0e0a"/>
  <!-- scanline texture -->
  <g opacity="0.10" fill="#4dff7c">
    <rect y="60" width="512" height="6"/><rect y="160" width="512" height="6"/>
    <rect y="260" width="512" height="6"/><rect y="360" width="512" height="6"/>
    <rect y="460" width="512" height="6"/>
  </g>
  <!-- drooping stem -->
  <path d="M256 430 C256 360 250 320 196 300" fill="none" stroke="#2a8c45" stroke-width="14" stroke-linecap="round"/>
  <!-- wilting flower head, tilted down -->
  <g transform="translate(176 286) rotate(-40)">
    <g fill="#4dff7c">
      <ellipse cx="0" cy="-34" rx="16" ry="36"/>
      <ellipse cx="0" cy="-34" rx="16" ry="36" transform="rotate(60)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="36" transform="rotate(120)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="36" transform="rotate(180)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="36" transform="rotate(240)"/>
      <ellipse cx="0" cy="-34" rx="16" ry="36" transform="rotate(300)"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="#ffd24d"/>
  </g>
  <!-- falling petals -->
  <ellipse cx="300" cy="340" rx="11" ry="22" fill="#b06b2e" transform="rotate(25 300 340)"/>
  <ellipse cx="340" cy="410" rx="9" ry="18" fill="#6b6b6b" transform="rotate(60 340 410)"/>
</svg>
