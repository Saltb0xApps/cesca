<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp Scheduler</title>
<style>
  :root { --green: #25d366; --dark: #075e54; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: #f0f2f5; color: #111;
  }
  header {
    background: var(--dark); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #444; color: #fff;
  }
  .badge.ready { background: var(--green); color: #04330f; }
  main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px;
  }
  .qr { text-align: center; }
  .qr img { width: 240px; height: 240px; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 15px;
  }
  button {
    background: var(--green); border: none; color: #04330f; font-weight: 600;
    padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
  button:hover { filter: brightness(.95); }
  .hint { color: #667; font-size: 13px; margin-top: 10px; }
  .error { color: #c0392b; font-size: 14px; margin-top: 10px; }
  .ok { color: #1d7a40; font-size: 14px; margin-top: 10px; }
  ul.msgs { list-style: none; padding: 0; margin: 0; }
  ul.msgs li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid #eee;
  }
  ul.msgs li:last-child { border-bottom: none; }
  .msg-body { flex: 1; }
  .msg-text { font-size: 15px; }
  .msg-meta { font-size: 13px; color: #667; margin-top: 2px; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .status.pending { background: #fff4d6; color: #8a6d00; }
  .status.sent { background: #d8f5e0; color: #1d7a40; }
  .status.failed { background: #fde3e0; color: #c0392b; }
  .cancel {
    background: none; border: none; color: #c0392b; cursor: pointer;
    font-size: 13px; padding: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>WhatsApp Scheduler</h1>
  <span id="conn" class="badge">connecting…</span>
</header>
<main>
  <div class="card qr" id="qrCard" style="display:none">
    <p>Link your WhatsApp: open WhatsApp → Settings → Linked Devices → scan this code.</p>
    <img id="qrImg" alt="QR code" />
  </div>

  <div class="card">
    <form id="form">
      <input type="text" id="command" autocomplete="off"
        placeholder='send "hey, let&#39;s catch up!" to John next Friday at 6pm' />
      <button type="submit">Schedule</button>
    </form>
    <div class="hint">
      Put the message in quotes, then who it's for and when:
      <em>send "running late, sorry!" to Maria tomorrow 9am</em>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Scheduled messages</h3>
    <ul class="msgs" id="msgs"><li class="msg-meta">Nothing scheduled yet.</li></ul>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function refreshStatus() {
  const r = await fetch('/api/status').then((r) => r.json()).catch(() => null);
  if (!r) return;
  const badge = $('conn');
  badge.textContent = r.status;
  badge.className = 'badge' + (r.status === 'ready' ? ' ready' : '');
  $('qrCard').style.display = r.qr ? '' : 'none';
  if (r.qr) $('qrImg').src = r.qr;
}

function fmt(iso) {
  return new Date(iso).toLocaleString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit',
  });
}

async function refreshMessages() {
  const msgs = await fetch('/api/messages').then((r) => r.json()).catch(() => []);
  const ul = $('msgs');
  if (!msgs.length) {
    ul.innerHTML = '<li class="msg-meta">Nothing scheduled yet.</li>';
    return;
  }
  ul.innerHTML = '';
  for (const m of msgs) {
    const li = document.createElement('li');
    const body = document.createElement('div');
    body.className = 'msg-body';
    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = `"${m.text}" → ${m.contactName}`;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = fmt(m.sendAt) + (m.error ? ` — ${m.error}` : '');
    body.append(text, meta);
    const status = document.createElement('span');
    status.className = 'status ' + m.status;
    status.textContent = m.status;
    li.append(body, status);
    if (m.status === 'pending') {
      const cancel = document.createElement('button');
      cancel.className = 'cancel';
      cancel.textContent = 'cancel';
      cancel.onclick = async () => {
        await fetch('/api/messages/' + m.id, { method: 'DELETE' });
        refreshMessages();
      };
      li.append(cancel);
    }
    ul.append(li);
  }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const command = $('command').value.trim();
  if (!command) return;
  const fb = $('feedback');
  fb.className = '';
  fb.textContent = 'Scheduling…';
  const r = await fetch('/api/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command }),
  });
  const data = await r.json();
  if (r.ok) {
    fb.className = 'ok';
    fb.textContent = `Scheduled for ${data.contactName} at ${fmt(data.sendAt)}`;
    $('command').value = '';
    refreshMessages();
  } else {
    fb.className = 'error';
    fb.textContent = data.error || 'Something went wrong';
  }
});

refreshStatus();
refreshMessages();
setInterval(refreshStatus, 3000);
setInterval(refreshMessages, 10000);
</script>
</body>
</html>
