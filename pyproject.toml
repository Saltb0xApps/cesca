[project]
name = "cesca"
version = "0.1.0"
description = "Cesca — a fully local, private CV scorer for macOS. Your data never leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cesca = "cesca.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cesca"]

[tool.setuptools.package-data]
cesca = ["static/*"]
